[project]
name = "statistical-machine-learning"
version = "0.1.0"
description = "Statistical Machine Learning and Bayesian Modeling laboratories"
authors = [
    { name = "Bartosz Hanc", email = "bartosz.hanc02@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8",
    "mnist>=0.2.2",
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "seaborn>=0.13",
    "tensorflow>=2.15,<2.16",
    "tensorflow-probability>=0.23,<0.24",
]

[tool.uv]
package = false
